name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify the dependency set is consistent
        run: python -m pip check

      - name: Run tests
        env:
          EVERGREEN_MASTER_KEY: g8Zr3nQ1kYy2vB7pS0dW4uX6tA9cE5fH1jL8mN3oP2Q=
        run: pytest -q

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused Redis test dependencies
        run: python -m pip install pytest==8.4.2 redis==8.0.1

      - name: Exercise real Redis transactions and TTL state
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/15
        run: pytest -q tests/test_state_redis.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1

      # Audit the shipped manifest, not the runner's packages or pip-audit's
      # dependencies. Findings block the build; there are no blanket ignores.
      - name: Audit production dependency graph
        run: pip-audit -r requirements.txt --strict --progress-spinner off

  rl-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Assert research stack is absent from production
        run: |
          ! grep -E '^(finrl|torch|stable-baselines3|alpaca-trade-api)=' requirements.txt

      # This is deliberately an isolated resolver check. requirements-rl.txt
      # cannot be combined with the production yfinance stack because their
      # websockets requirements conflict, and it is never built into the app.
      - name: Resolve optional research manifest
        run: python -m pip install --dry-run -r requirements-rl.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff==0.16.0

      # Legacy analytics modules are not yet style-clean. Gate syntax,
      # undefined names, and other correctness-level errors instead of
      # pretending hundreds of pre-existing style findings are a useful gate.
      - name: Lint correctness rules
        run: ruff check api/ tests/ scripts/ --isolated --select E9,F63,F7,F82

  container-smoke:
    runs-on: ubuntu-latest
    needs: [test, redis-integration]
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose model
        run: |
          cp .env.example .env
          sed -i 's|^EVERGREEN_MASTER_KEY=$|EVERGREEN_MASTER_KEY=g8Zr3nQ1kYy2vB7pS0dW4uX6tA9cE5fH1jL8mN3oP2Q=|' .env
          mkdir -p api/cache api/charts api/__pycache__
          printf 'context-secret-canary' > api/.env
          printf 'context-database-canary' > api/canary.db
          printf 'context-cache-canary' > api/cache/canary
          printf 'context-bytecode-canary' > api/__pycache__/canary.pyc
          docker compose config --quiet

      - name: Build the production image
        run: docker compose build app

      - name: Prove sensitive context canaries were excluded
        run: |
          image_id="$(docker compose images -q app)"
          docker run --rm --entrypoint python "$image_id" -c "from pathlib import Path; forbidden=['/app/api/.env','/app/api/canary.db','/app/api/cache/canary','/app/api/__pycache__/canary.pyc']; assert not any(Path(path).exists() for path in forbidden), forbidden"

      - name: Start app with its real Redis dependency
        env:
          EVERGREEN_ENV: development
        run: docker compose up -d --wait --wait-timeout 180 redis app

      - name: Verify container health and shared state
        run: |
          docker compose exec -T app python /app/scripts/healthcheck.py
          docker compose exec -T app python -c "import json,urllib.request; body=json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)); assert body['checks']['shared_state'] == 'redis', body"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color app redis

      - name: Tear down smoke stack
        if: always()
        run: docker compose down --volumes

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
