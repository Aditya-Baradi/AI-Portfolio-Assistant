name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Core deps only (no reinforcement-learning stack). The full
      # requirements.txt does not resolve cleanly — see SECURITY.md — but the
      # core set does, and it's all the test suite needs (FinRL's import is
      # guarded, so its absence just falls back to the PyPortfolioOpt optimizer).
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-core.txt

      - name: Run tests
        run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Report known vulnerabilities. Non-blocking: the RL stack (torch etc.)
      # carries CVEs that can't be resolved without breaking FinRL — see the
      # dependency risk table in SECURITY.md. Scans the core set that we CAN
      # keep current; review the output on every run.
      - name: pip-audit (core deps)
        run: |
          pip install pip-audit
          pip-audit -r requirements-core.txt --strict || true
